version: 2

sources:
  - name: educacao
    description: >
      Extrato anonimizado e aleatorizado do RMI com dados da rede municipal de educação
      (ano letivo de 2025, com as datas deslocadas para o ano 2000). 
      Tipos e granularidades abaixo foram conferidos nos dados
      e corrigem o schema fornecido com o desafio onde ele diverge.
    schema: rmi_raw
    config:
      tags: ["fonte", "educacao"]
      meta:
        origem: "RMI / SME (extrato anonimizado do desafio)"
        sensibilidade: "dados de estudantes anonimizados (LGPD)"
      freshness:
        warn_after: {count: 365, period: day}
        error_after: {count: 400, period: day}   
    tables:
      - name: aluno
        description: >
          Cadastro de alunos. Granularidade: 1 linha por aluno.
          Coerente com `turma` e `avaliacao`; não se liga à `frequencia` pelo id do aluno.
        columns:
          - name: id_aluno
            data_type: bytes
            description: "Hash de 17 bytes do aluno. Chega como BYTES (o schema fornecido diz STRING). Staging converte para texto."
            data_tests:
              - unique:
                  description: "Chave do cadastro: duplicidade inflaria qualquer contagem de alunos."
              - not_null:
                  description: "Aluno sem id não se liga a turma nem a avaliação."
          - name: id_turma
            data_type: int64
            description: "Hash da turma do aluno (1 turma por aluno)."
          - name: faixa_etaria
            data_type: string
            description: "Faixa etária derivada da idade atual, não da idade durante o ano letivo."
            data_tests:
              - accepted_values:
                  description: "Só as 5 faixas documentadas."
                  arguments:
                    values: ["0-5", "6-10", "11-14", "15-17", "18+"]
          - name: bairro
            data_type: int64
            description: >
              Hash do bairro de residência (tem nulos). Não é comparável com o hash
              de bairro da escola: os dois não têm nenhum valor em comum.

      - name: avaliacao
        description: >
          Avaliação por aluno × turma × bimestre em formato largo: uma coluna de nota por
          disciplina (com ruído de ±0,2) e a frequência do bimestre calculada pelo sistema
          de origem. Notas por disciplina só existem a partir dos anos finais do fundamental;
          Inglês (`disciplina_3`) vem 100% nulo.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              name: src_avaliacao__grao_sem_duplicatas
              description: >
                Monitora duplicação na origem: a extração do desafio tem algumas chaves
                repetidas, que a staging deduplica. O teste avisa sempre e só falha se o
                problema crescer além do limite.
              arguments:
                combination_of_columns: [id_aluno, id_turma, bimestre]
              config:
                warn_if: ">0"
                error_if: ">500"
        columns:
          - name: id_aluno
            data_type: bytes
            description: "Hash de 17 bytes do aluno (BYTES); coerente com `aluno` e `turma`."
            data_tests:
              - not_null
          - name: id_turma
            data_type: int64
            description: "Hash com sal do id da turma."
            data_tests:
              - not_null
          - name: frequencia
            data_type: float64
            description: >
              Frequência do aluno no bimestre (não acumulada), em percentual de 0 a 100,
              calculada pelo sistema de origem. Tem nulos.
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  name: src_avaliacao__frequencia_percentual
                  description: "Percentual válido; é a referência para conferir a frequência corrigida da tabela `frequencia`."
                  arguments:
                    min_value: 0
                    max_value: 100
          - name: bimestre
            data_type: string
            description: "Bimestre do ano letivo (1 a 4). Chega como texto (o schema fornecido diz INT64); a staging converte para inteiro."
            data_tests:
              - not_null
              - dbt_expectations.expect_column_values_to_be_of_type:
                  name: src_avaliacao__bimestre_e_texto
                  description: "Trava o tipo real na origem: se passar a vir como inteiro, a conversão da staging deve ser revista."
                  arguments:
                    column_type: string
              - accepted_values:
                  description: "Só os 4 bimestres do ano letivo; outro valor indicaria erro de carga ou mudança na origem."
                  arguments:
                    values: ["1", "2", "3", "4"]
          - name: disciplina_1
            data_type: float64
            description: "Nota de Língua Portuguesa (0 a 10, com ruído de ±0,2)."
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  name: src_avaliacao__nota_portugues_0_10
                  description: "Nota fora da escala indicaria erro na origem ou no ruído de anonimização."
                  arguments:
                    min_value: 0
                    max_value: 10
          - name: disciplina_2
            data_type: float64
            description: "Nota de Ciências (0 a 10, com ruído de ±0,2)."
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  name: src_avaliacao__nota_ciencias_0_10
                  description: "Nota fora da escala indicaria erro na origem ou no ruído de anonimização."
                  arguments:
                    min_value: 0
                    max_value: 10
          - name: disciplina_3
            data_type: float64
            description: "Nota de Inglês: 100% nula nesta extração; fica fora das análises de nota."
          - name: disciplina_4
            data_type: float64
            description: "Nota de Matemática (0 a 10, com ruído de ±0,2)."
            data_tests:
              - dbt_expectations.expect_column_values_to_be_between:
                  name: src_avaliacao__nota_matematica_0_10
                  description: "Nota fora da escala indicaria erro na origem ou no ruído de anonimização."
                  arguments:
                    min_value: 0
                    max_value: 10

      - name: escola
        description: >
          Cadastro de unidades escolares. Granularidade: 1 linha por escola. Traz só id e
          hash do bairro: não há tipo nem região, ao contrário do enunciado. Nem todas as
          escolas aparecem na frequência.
        columns:
          - name: id_escola
            data_type: int64
            description: "Hash com sal do id da escola."
            data_tests:
              - unique:
                  description: "Chave do cadastro de escolas, usada pela frequência."
              - not_null
          - name: bairro
            data_type: int64
            description: "Hash do bairro da escola. É o único recorte territorial disponível."
            data_tests:
              - not_null:
                  description: "Sem bairro, a escola some do recorte territorial do mart."

      - name: frequencia
        description: >
          Frequência por aluno × turma × disciplina × período, e não por aluno/dia como diz
          o enunciado. O período é em geral mensal, cortado no fim de cada bimestre (09/05 e
          17/07). A coluna `frequencia` foi gravada como 100 − faltas/dias_letivos, sem o ×100.
          Os ids de aluno existem no cadastro, mas não identificam o mesmo aluno: entre
          tabelas, só turma e escola são chaves confiáveis.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              name: src_frequencia__grao_sem_duplicatas
              description: >
                Monitora duplicação na origem: a extração do desafio tem duplicatas exatas e
                chaves com valores conflitantes, que a staging trata. O teste avisa sempre e
                só falha se o problema crescer além do limite.
              arguments:
                combination_of_columns: [id_aluno, id_turma, disciplina, data_inicio]
              config:
                warn_if: ">0"
                error_if: ">5000"
          - dbt_utils.expression_is_true:
              name: src_frequencia__formula_sem_x100
              description: >
                Guarda da premissa da correção: `frequencia` precisa existir e ficar entre
                90 e 100. Se surgir valor abaixo de 90, a origem passou a gravar o percentual
                correto e a correção do ×100 precisa sair. A coluna aparece como
                `frequencia.frequencia` porque tem o mesmo nome da tabela: sem o prefixo,
                o BigQuery entende `frequencia` como a linha inteira.
              arguments:
                expression: "frequencia.frequencia is not null and frequencia.frequencia between 90 and 100"
        columns:
          - name: id_escola
            data_type: int64
            description: "Hash com sal do id da escola. Cada turma pertence a uma única escola."
            data_tests:
              - not_null
              - relationships:
                  description: "Toda frequência precisa de uma escola cadastrada para entrar no mart por escola."
                  arguments:
                    to: source('educacao', 'escola')
                    field: id_escola
          - name: id_aluno
            data_type: bytes
            description: "Hash de 17 bytes (BYTES). Use só dentro desta tabela: não identifica o mesmo aluno do cadastro."
            data_tests:
              - not_null
              - dbt_expectations.expect_column_values_to_be_of_type:
                  name: src_frequencia__id_aluno_e_bytes
                  description: "Trava o tipo real (o schema fornecido diz STRING); a staging converte com to_hex."
                  arguments:
                    column_type: bytes
          - name: id_turma
            data_type: int64
            description: "Hash com sal do id da turma."
            data_tests:
              - not_null
          - name: data_inicio
            data_type: string
            description: "Início do período de apuração (texto AAAA-MM-DD, ano deslocado para 2000)."
            data_tests:
              - not_null
          - name: data_fim
            data_type: string
            description: "Fim do período de apuração (texto AAAA-MM-DD, ano deslocado para 2000)."
            data_tests:
              - not_null
          - name: disciplina
            data_type: string
            description: "disciplina_1 = Português, disciplina_2 = Ciências, disciplina_3 = Inglês, disciplina_4 = Matemática."
            data_tests:
              - accepted_values:
                  description: "A staging dá nome a exatamente estas 4 disciplinas; uma nova ficaria sem nome."
                  arguments:
                    values: ["disciplina_1", "disciplina_2", "disciplina_3", "disciplina_4"]
          - name: frequencia
            data_type: float64
            description: >
              100 − faltas_disciplina/dias_letivos (fórmula da origem, sem o ×100).
              Por isso todos os valores ficam perto de 100.

      - name: turma
        description: >
          Relação aluno–turma, não um cadastro de turmas: não traz série, turno nem escola.
          Granularidade: 1 linha por aluno (cada aluno em uma turma).
        columns:
          - name: ano
            data_type: int64
            description: "Ano letivo anonimizado: sempre 2000 (o ano real é 2025)."
            data_tests:
              - accepted_values:
                  description: "O deslocamento das datas assume um único ano letivo; outro ano exigiria rever as datas."
                  arguments:
                    values: [2000]
                    quote: false
          - name: id_turma
            data_type: int64
            description: "Hash com sal do id da turma; consistente com `frequencia` e `avaliacao`."
            data_tests:
              - not_null
          - name: id_aluno
            data_type: bytes
            description: "Hash de 17 bytes do aluno (BYTES)."
            data_tests:
              - unique:
                  description: "Garante a granularidade de 1 linha por aluno."
              - not_null

  - name: dados_mestres
    description: >
      Tabela pública de bairros, indicada no enunciado como auxiliar. 
      Declarada para documentação: nos Parquets o bairro vem como
      hash (INT64) e não há chave para juntar com esta tabela sem desfazer a anonimização,
      o que o enunciado proíbe.
    database: datario
    schema: dados_mestres
    tables:
      - name: bairro
        description: "Cadastro oficial de bairros do Rio de Janeiro."

models:
  - name: stg_educacao__aluno
    description: >
      Cadastro de alunos com ids padronizados como texto. Granularidade: 1 linha por aluno.
      Liga-se a turma e avaliação pelo id do aluno; com a frequência, só pela turma,
      porque os ids de aluno da frequência não identificam o mesmo aluno.
    columns:
      - name: id_aluno
        data_type: string
        description: "Hash do aluno em texto hexadecimal (34 caracteres), convertido de BYTES com to_hex. Chave do modelo."
        data_tests:
          - unique:
              description: "Chave do modelo: os modelos seguintes dependem de exatamente 1 linha por aluno."
          - not_null
      - name: id_turma
        data_type: string
        description: "Hash da turma do aluno, em texto."
      - name: faixa_etaria
        data_type: string
        description: "Faixa etária derivada da idade atual (na extração), não da idade durante o ano letivo."
      - name: id_bairro_residencia
        data_type: string
        description: "Hash do bairro de residência, em texto (tem nulos). Não é comparável com o bairro da escola."

  - name: stg_educacao__aluno_turma
    description: >
      Vínculo aluno–turma (tabela `turma` da origem), com ids em texto. Granularidade:
      1 linha por aluno. A turma de cada aluno é a mesma do cadastro de alunos.
    columns:
      - name: id_aluno
        data_type: string
        description: "Hash do aluno em texto hexadecimal; mesmo id de `stg_educacao__aluno`. Chave do modelo."
        data_tests:
          - unique:
              description: "Cada aluno está em uma única turma."
          - not_null
          - relationships:
              description: "Todo vínculo precisa de um aluno cadastrado."
              arguments:
                to: ref('stg_educacao__aluno')
                field: id_aluno
      - name: id_turma
        data_type: string
        description: "Hash da turma, em texto."
        data_tests:
          - not_null
      - name: ano_letivo
        data_type: int64
        description: "Ano letivo anonimizado: sempre 2000 (o ano real é 2025)."

  - name: stg_educacao__avaliacao
    description: >
      Avaliação por aluno × turma × bimestre, com uma coluna de nota por disciplina (notas só
      a partir dos anos finais do fundamental). Deduplicada: quando a origem repete a chave,
      fica a linha com frequência preenchida e, entre elas, a de menor frequência; empate,
      a de menores notas. Sem Inglês, que vem 100% nulo na origem.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: stg_avaliacao__grao_unico
          description: "Depois da deduplicação, a chave aluno × turma × bimestre não pode se repetir."
          arguments:
            combination_of_columns: [id_aluno, id_turma, bimestre]
    columns:
      - name: id_aluno
        data_type: string
        description: "Hash do aluno em texto hexadecimal; mesmo id de `stg_educacao__aluno`."
        data_tests:
          - not_null
          - relationships:
              description: "Toda avaliação precisa de um aluno cadastrado."
              arguments:
                to: ref('stg_educacao__aluno')
                field: id_aluno
      - name: id_turma
        data_type: string
        description: "Hash da turma em que o aluno foi avaliado, em texto. Pode não ser a turma atual do aluno."
        data_tests:
          - not_null
      - name: bimestre
        data_type: int64
        description: "Bimestre do ano letivo (1 a 4), convertido de texto para inteiro."
        data_tests:
          - not_null
          - accepted_values:
              description: "A conversão de texto para inteiro só pode resultar nos 4 bimestres; outro valor indicaria falha na conversão."
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: frequencia_bimestre
        data_type: float64
        description: "Frequência do aluno no bimestre, em percentual de 0 a 100, calculada pela origem. Tem nulos."
      - name: nota_portugues
        data_type: float64
        description: "Nota de Língua Portuguesa (0 a 10, com ruído de ±0,2)."
      - name: nota_ciencias
        data_type: float64
        description: "Nota de Ciências (0 a 10, com ruído de ±0,2)."
      - name: nota_matematica
        data_type: float64
        description: "Nota de Matemática (0 a 10, com ruído de ±0,2)."

  - name: stg_educacao__escola
    description: >
      Cadastro de escolas com ids em texto. Granularidade: 1 linha por escola.
      Traz só o id e o hash do bairro da escola.
    columns:
      - name: id_escola
        data_type: string
        description: "Hash da escola, em texto. Chave do modelo."
        data_tests:
          - unique:
              description: "A frequência e o mart por escola dependem de 1 linha por escola."
          - not_null
      - name: id_bairro_escola
        data_type: string
        description: "Hash do bairro da escola, em texto. Único recorte territorial disponível; não é comparável com o bairro de residência do aluno."
        data_tests:
          - not_null

  - name: stg_educacao__frequencia
    description: >
      Frequência por aluno × turma × disciplina × período (em geral mensal), com ids em
      texto, datas como DATE e disciplina pelo nome. Deduplicada: quando a origem repete a
      chave, fica a linha de menor frequência (mais faltas). A correção do ×100 é feita
      na camada intermediate.   
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: stg_frequencia__grao_unico
          description: "Depois da deduplicação, a chave aluno × turma × disciplina × início do período não pode se repetir."
          arguments:
            combination_of_columns: [id_aluno_frequencia, id_turma, disciplina, data_inicio]
      - dbt_utils.expression_is_true:
          name: stg_frequencia__periodo_valido
          description: "O período de apuração não pode terminar antes de começar."
          arguments:
            expression: "data_fim >= data_inicio"
    columns:
      - name: id_escola
        data_type: string
        description: "Hash da escola, em texto."
        data_tests:
          - not_null
          - relationships:
              description: "Toda frequência precisa de uma escola cadastrada para entrar no mart por escola."
              arguments:
                to: ref('stg_educacao__escola')
                field: id_escola
      - name: id_aluno_frequencia
        data_type: string
        description: "Hash do aluno em texto hexadecimal. Não identifica o mesmo aluno do cadastro: use só dentro desta tabela."
        data_tests:
          - not_null
      - name: id_turma
        data_type: string
        description: "Hash da turma, em texto. Parte das turmas não aparece no vínculo aluno–turma; isso é tratado na intermediate."
        data_tests:
          - not_null
      - name: disciplina
        data_type: string
        description: "Nome da disciplina: portugues, ciencias, ingles ou matematica."
        data_tests:
          - not_null
          - accepted_values:
              description: "Só os 4 nomes que a staging atribui; com o not_null, garante que toda disciplina da origem foi mapeada."
              arguments:
                values: ["portugues", "ciencias", "ingles", "matematica"]
      - name: data_inicio
        data_type: date
        description: "Início do período de apuração (ano deslocado para 2000)."
        data_tests:
          - not_null
      - name: data_fim
        data_type: date
        description: "Fim do período de apuração (ano deslocado para 2000)."
        data_tests:
          - not_null
      - name: frequencia_bruta
        data_type: float64
        description: >
          Valor da origem, gravado como 100 − faltas/dias_letivos (sem o ×100). Não é
          percentual: a intermediate aplica o ×100 que faltou.
        data_tests:
          - not_null
