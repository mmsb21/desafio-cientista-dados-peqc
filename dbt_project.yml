name: 'rmi_educacao'
version: '1.0.0'

profile: 'rmi_educacao'
require-dbt-version: [">=1.11.0", "<2.0.0"]

model-paths: ["models"]
test-paths:  ["tests"]
seed-paths:  ["seeds"]
macro-paths: ["macros"]

clean-targets:         
  - "target"
  - "dbt_packages"

vars:
  "dbt_date:time_zone": "America/Sao_Paulo"

models:
  rmi_educacao:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]

